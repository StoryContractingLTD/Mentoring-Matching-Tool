<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Find Your Match | Story Learning &amp; Development</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:#EAF4FB;font-family:'Barlow',system-ui,sans-serif;color:#333}
body.text-lg{font-size:118%}
body.text-lg .q-text{font-size:34px}
body.text-lg .opt,body.text-lg .subtitle,body.text-lg p,body.text-lg li{font-size:18px}
button{font-family:inherit}
:focus-visible{outline:3px solid #009FA0;outline-offset:2px}

.header{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;gap:12px;flex-wrap:wrap}
.header-left{display:flex;align-items:center;gap:16px}
.divider{width:1px;height:28px;background:#c8d8e8}
.tag{font-size:12px;font-weight:600;color:#8fa0b0;letter-spacing:.2em;text-transform:uppercase}
.logo svg{height:36px;width:auto;display:block}
.header-right{display:flex;gap:10px}
.pill-btn{display:inline-flex;align-items:center;gap:8px;background:white;color:#0061AD;border:1.5px solid #d1e3f3;border-radius:20px;padding:8px 16px;font-weight:600;font-size:13px;cursor:pointer;transition:all .2s ease}
.pill-btn:hover{background:#f0f7fd;border-color:#0061AD}
.pill-btn.active{background:#0061AD;color:white;border-color:#0061AD}

.container{max-width:880px;margin:0 auto;padding:8px 32px 64px}
.title-block{text-align:center;margin:24px auto 8px;max-width:720px}
.title{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:46px;font-weight:800;color:#004B86;letter-spacing:-.02em;line-height:1.08}
.subtitle{color:#5d6b78;font-size:16px;line-height:1.7;margin-top:14px}

.progress-wrap{max-width:720px;margin:20px auto 28px;display:flex;align-items:center;gap:16px}
.progress-bar{flex:1;height:6px;background:#dce8f3;border-radius:6px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#0061AD,#009FA0);border-radius:6px;transition:width .35s cubic-bezier(.4,0,.2,1)}
.progress-text{font-size:12px;color:#7d8e9e;font-weight:600;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}

.still .card,.still .res-hero,.still .res-card{animation:none}
.card{background:white;border-radius:28px;padding:40px 36px;box-shadow:0 6px 24px rgba(0,97,173,.07);animation:fadeIn .35s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.q-section{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;color:#009FA0;letter-spacing:.22em;text-transform:uppercase;margin-bottom:10px}
.q-text{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:30px;font-weight:800;color:#1A3A5C;line-height:1.2;margin-bottom:12px}
.q-hint{color:#6b7c8c;font-size:15px;line-height:1.6;margin-bottom:22px}
.scenario{background:#f3f8fc;border-left:5px solid #0061AD;border-radius:0 16px 16px 0;padding:18px 22px;margin-bottom:22px;color:#2a3a4a;font-size:16px;line-height:1.65}
.field-label{font-weight:700;color:#1A3A5C;font-size:15px;margin:22px 0 10px}
.field-label:first-child{margin-top:0}

.opts{display:flex;flex-direction:column;gap:10px}
.opts.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.opt{display:flex;align-items:center;gap:14px;background:#f6fafd;border:2px solid #e3edf6;border-radius:16px;padding:15px 20px;cursor:pointer;transition:all .18s ease;text-align:left;font-size:15.5px;color:#2a3a4a;font-weight:500;width:100%;line-height:1.45}
.opt:hover{border-color:#9bc6e6;background:#eef6fc}
.opt[aria-pressed="true"]{border-color:#0061AD;background:#e8f2fb;color:#004B86;font-weight:600}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid #b8cbdc;flex-shrink:0;position:relative}
.opt[aria-pressed="true"] .dot{border-color:#0061AD;background:#0061AD}
.opt[aria-pressed="true"] .dot::after{content:'';position:absolute;inset:3px;border-radius:50%;background:white}
.check{width:20px;height:20px;border-radius:6px;border:2px solid #b8cbdc;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:white;font-size:13px;font-weight:800}
.opt[aria-pressed="true"] .check{border-color:#0061AD;background:#0061AD}
.rank{width:28px;height:28px;border-radius:50%;background:#e3edf6;color:#8fa0b0;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Barlow Condensed',sans-serif;font-size:16px}
.opt[aria-pressed="true"] .rank{background:#0061AD;color:white}
.opt small{display:block;font-weight:400;color:#6b7c8c;font-size:13.5px;margin-top:2px}

.exp-row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #e8eff6}
.exp-row:last-child{border-bottom:none}
.exp-name{font-weight:700;color:#1A3A5C;font-size:15.5px}
.exp-eg{color:#6b7c8c;font-size:13.5px;margin-top:2px;line-height:1.45}
.seg{display:flex;background:#f0f5fa;border-radius:12px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;padding:8px 11px;border-radius:9px;font-size:13px;font-weight:600;color:#5d6b78;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:#0061AD;color:white}
.seg button:hover:not([aria-pressed="true"]){background:#e1ecf6}

.nav{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:12px}
.nav-btn{display:inline-flex;align-items:center;gap:8px;background:white;color:#0061AD;border:1.5px solid #d1e3f3;border-radius:24px;padding:12px 24px;font-weight:600;font-size:15px;cursor:pointer}
.nav-btn:hover:not(:disabled){background:#f0f7fd}
.nav-btn.primary{background:#0061AD;color:white;border-color:#0061AD;box-shadow:0 6px 20px rgba(0,97,173,.22)}
.nav-btn.primary:hover:not(:disabled){background:#004B86}
.nav-btn:disabled{opacity:.4;cursor:not-allowed}
.nav-note{font-size:13px;color:#8fa0b0}

.path-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}
.path-card{background:white;border:2px solid #e3edf6;border-radius:24px;padding:30px 26px;text-align:left;cursor:pointer;transition:all .2s ease;box-shadow:0 6px 24px rgba(0,97,173,.06)}
.path-card:hover{border-color:#0061AD;transform:translateY(-3px)}
.path-card h2{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;color:#004B86;margin:14px 0 8px}
.path-card p{color:#5d6b78;font-size:15px;line-height:1.6}
.path-icon{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.path-icon svg{width:28px;height:28px}
.how{background:white;border-radius:24px;padding:24px 28px;margin-top:22px;color:#4a5866;font-size:15px;line-height:1.7}
.how h3{font-family:'Barlow Condensed',sans-serif;font-size:20px;color:#1A3A5C;margin-bottom:6px}
.how ol{padding-left:20px}

/* Results */
.res-hero{background:linear-gradient(135deg,#0061AD,#004B86);color:white;border-radius:28px;padding:34px 36px;margin-bottom:20px}
.res-hero .eyebrow{font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;opacity:.8}
.res-hero h2{font-family:'Barlow Condensed',sans-serif;font-size:40px;font-weight:800;line-height:1.1;margin:8px 0 10px}
.res-hero p{opacity:.92;line-height:1.65;font-size:16px}
.res-card{background:white;border-radius:24px;padding:28px 30px;margin-bottom:18px;box-shadow:0 6px 24px rgba(0,97,173,.06)}
.res-card h3{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;color:#1A3A5C;margin-bottom:6px}
.res-card > p{color:#5d6b78;line-height:1.65;font-size:15px}
.spectrum{margin:20px 0 6px}
.spec-labels{display:flex;justify-content:space-between;font-weight:700;font-size:14px;color:#1A3A5C;margin-bottom:8px}
.spec-track{position:relative;height:10px;border-radius:10px;background:linear-gradient(90deg,#cfe3f3,#e8eef3 50%,#cdeeee)}
.spec-marker{position:absolute;top:50%;width:24px;height:24px;border-radius:50%;background:#0061AD;border:4px solid white;box-shadow:0 2px 8px rgba(0,0,0,.2);transform:translate(-50%,-50%)}
.spec-desc{font-size:14px;color:#5d6b78;margin-top:10px;line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:#eef6fc;color:#004B86;border-radius:20px;padding:6px 14px;font-size:14px;font-weight:600}
.chip.teal{background:#e2f5f5;color:#00706f}
.code-box{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#f3f8fc;border:2px dashed #9bc6e6;border-radius:18px;padding:18px 20px;margin-top:14px}
.code{font-family:Consolas,'Courier New',monospace;font-size:22px;font-weight:700;color:#004B86;letter-spacing:.06em;flex:1;min-width:260px;word-break:break-all}
.note{background:#fff8e8;border-left:5px solid #e8a00e;border-radius:0 14px 14px 0;padding:14px 18px;margin-top:16px;font-size:14.5px;color:#5a4a20;line-height:1.6}
.route-switch{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.steps li{margin:6px 0;line-height:1.6;color:#4a5866}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1A3A5C;color:white;padding:12px 22px;border-radius:24px;font-weight:600;opacity:0;transition:all .25s ease;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:640px){
  .header{padding:12px 16px}.container{padding:8px 16px 48px}
  .card{padding:26px 20px;border-radius:22px}.title{font-size:36px}.q-text{font-size:25px}
  .path-grid{grid-template-columns:1fr}.exp-row{grid-template-columns:1fr}
  .seg{overflow-x:auto}.res-hero{padding:26px 22px}.res-hero h2{font-size:32px}.res-card{padding:22px 20px}
  .code{font-size:18px;min-width:0}
}
@media print{
  .header-right,.nav,.no-print,.progress-wrap{display:none!important}
  html,body{background:white}.res-card,.res-hero{box-shadow:none;break-inside:avoid}
  .res-hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

    <div class="logo" id="logo" aria-label="Story"></div>

    <div class="tag">Mentoring &amp; Coaching</div>
  </div>
  <div class="header-right">
    <button class="pill-btn" id="text-btn" onclick="toggleText()" aria-pressed="false">Larger text</button>
    <button class="pill-btn" id="restart-btn" onclick="restart()" style="display:none">Start again</button>
  </div>
</div>
<main class="container" id="app" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>

// ---------- Code encode / decode ----------
// Layout (22 data chars + 2 checksum):
//  0 role-specific A (supporter: offer 1-3 | seeker: route 1-3)
//  1 role-specific B (supporter: capacity 1-3 | seeker: area pref 0-2)
//  2-4 style D,C,S (0-8)
//  5 level, 6 business, 7 setting, 8 region, 9 format mask, 10 frequency
//  11-21 areas (supporter: experience 0-3 | seeker: priority rank 0-3, 1 = top)
function checksum(vals) {
  let s = 7;
  vals.forEach((v, i) => { s = (s * 31 + (v + 1) * (i + 3)) % (34 * 34); });
  return [Math.floor(s / 34), s % 34];
}
function encodeProfile(p) {
  const vals = [p.a, p.b, ...p.style, p.level, p.biz, p.setting, p.region, p.fmt, p.freq, ...p.areas];
  const ck = checksum(vals);
  const body = vals.concat(ck).map(v => ALPHABET[v]).join('');
  return CODE_VERSION + '-' + p.role + '-' + body.match(/.{1,4}/g).join('-');
}
function decodeProfile(raw) {
  const m = String(raw).toUpperCase().match(/SMC1[\s-]*([ML])[\s-]*((?:[0-9A-HJ-NP-Z][\s-]*){24})/);
  if (!m) return null;
  const chars = m[2].replace(/[\s-]/g, '').split('');
  const vals = chars.map(c => ALPHABET.indexOf(c));
  if (vals.some(v => v < 0)) return null;
  const data = vals.slice(0, 22), ck = checksum(data);
  if (ck[0] !== vals[22] || ck[1] !== vals[23]) return { error: 'checksum' };
  const p = {
    role: m[1], a: data[0], b: data[1], style: data.slice(2, 5),
    level: data[5], biz: data[6], setting: data[7], region: data[8], fmt: data[9], freq: data[10],
    areas: data.slice(11, 22)
  };
  const ok = p.a >= 1 && p.a <= 3 && p.style.every(v => v <= 8) && p.level < LEVELS.length &&
    p.biz < BUSINESS.length && p.setting < SETTINGS.length && p.region < REGIONS.length &&
    p.fmt >= 1 && p.fmt <= 3 && p.freq < FREQUENCIES.length && p.areas.every(v => v <= 3);
  if (!ok) return { error: 'range' };
  p.code = encodeProfile(p);
  return p;
}

// Normalise raw scenario totals to 0-8 using the min / max possible per dimension
const DIM_RANGE = {};
DIMS.forEach(d => {
  let lo = 0, hi = 0;
  SCENARIOS.forEach(s => {
    const vals = s.options.map(o => o.v[d.key] || 0);
    lo += Math.min(...vals); hi += Math.max(...vals);

});

function steps() {

  if (S.path === 'M') list.push('experience', 'offer');

  list.push('practical', 'result');
  return list;
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function opt(label, pressed, onclick, kind, extra) {

}
function radios(field, list, cls) {

function setField(f, v) { S[f] = v; render(); }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }

function styleScores() {
  const raw = { D: 0, C: 0, S: 0 };
  S.sc.forEach((a, i) => { if (a === null) return; const v = SCENARIOS[i].options[a].v; for (const k in v) raw[k] += v[k]; });
  return DIMS.map(d => { const [lo, hi] = DIM_RANGE[d.key]; return Math.round((raw[d.key] - lo) / (hi - lo) * 8); });
}
function routeSuggestion() {
  // Mirrors the "Mentor or Coach?" toolkit: low Can Do -> mentoring; capable but needs
  // to unlock confidence or performance -> coaching. Stated preference counts too.
  let score = 0; // positive = coaching
  if (S.canDo !== null) score += S.canDo <= 1 ? -2 : 2;
  if (S.canDo >= 2 && S.conf !== null && S.conf <= 1) score += 1;
  if (S.pref === 0) score -= 2; if (S.pref === 1) score += 2;
  const D = styleScores()[0];

  return score >= 2 ? 2 : score <= -2 ? 1 : 3;
}
function currentRoute() { return S.routeOverride || routeSuggestion(); }

function buildProfile() {
  const areas = S.path === 'M' ? S.exp.map(v => v || 0) : AREAS.map((_, i) => { const r = S.focus.indexOf(i); return r < 0 ? 0 : r + 1; });
  return {
    role: S.path,
    a: S.path === 'M' ? S.offer : currentRoute(),

    fmt: S.fmt, freq: S.freq, areas

}

function stepValid(id) {
  if (id === 'about') return S.level !== null && S.biz !== null && S.setting !== null && S.region !== null;
  if (id.startsWith('sc')) return S.sc[+id.slice(2)] !== null;
  if (id === 'experience') return S.exp.every(v => v !== null);
  if (id === 'offer') return S.offer !== null && S.capacity !== null;
  if (id === 'focus') return S.focus.length >= 1;
  if (id === 'route') return S.canDo !== null && S.conf !== null && S.pref !== null;
  if (id === 'practical') return S.fmt > 0 && S.freq !== null && (S.path === 'M' || S.areaPref !== null);
  return true;
}

function go(delta) {
  const list = steps();
  const id = list[S.step];
  if (delta > 0 && !stepValid(id)) return;
  S.step = Math.max(0, Math.min(list.length - 1, S.step + delta));
  render(); window.scrollTo({ top: 0, behavior: 'smooth' });

}

    (ok ? '' : '<span class="nav-note">Answer to continue</span>') +
    '<button class="nav-btn primary" onclick="go(1)" ' + (ok ? '' : 'disabled') + '>' + (label || 'Next') + ' &rarr;</button></div>';
}

    const route = currentRoute(), sugg = routeSuggestion();
    const routeText = { 1: 'A mentor looks like a great fit', 2: 'A coach looks like a great fit', 3: 'You\'d do well with a mentor or a coach' }[route];
    const routeWhy = { 1: 'You\'re building knowledge and experience in your priority area, so someone who\'s been there and can share what they\'ve learned should help most.', 2: 'You already have a good grounding in your priority area, so someone who helps you unlock your own thinking and confidence should help most.', 3: 'Your answers point both ways, so we\'ll look across both mentors and coaches for your best fit.' }[route];
    h += '<div class="res-hero" style="background:linear-gradient(135deg,#009FA0,#0061AD)"><div class="eyebrow">Your match profile</div><h2>' + routeText + '</h2><p>' + routeWhy + '</p></div>';
    h += '<div class="res-card no-print"><h3>Does that feel right?</h3><p>You can change this if you know what you\'d prefer.' + (S.routeOverride && S.routeOverride !== sugg ? ' Our suggestion was <strong>' + ROUTES[sugg].toLowerCase() + '</strong>.' : '') + '</p><div class="route-switch">' +
      [1, 2, 3].map(v => '<button class="pill-btn' + (route === v ? ' active' : '') + '" aria-pressed="' + (route === v) + '" onclick="setRoute(' + v + ')">' + ROUTES[v] + '</button>').join('') + '</div></div>';
    h += '<div class="res-card"><h3>What you want to work on</h3><div class="chips">' + S.focus.map((i, r) => '<span class="chip">' + (r + 1) + '. ' + esc(AREAS[i].name) + '</span>').join('') + '</div></div>';
    h += '<div class="res-card"><h3>The support that suits you</h3><p>Based on what you said would help you most in the scenarios.</p>' + DIMS.map((d, i) => spectrum(d, st[i], false)).join('') + '</div>';
  }

  const url = M ? FORM_URL_SUPPORTER : FORM_URL_SEEKER;
  h += '<div class="res-card"><h3>Your match code</h3><p>Copy this code and paste it into the Mentoring &amp; Coaching form. It only holds your answers above, with no names or personal details.</p>' +
    '<div class="code-box"><span class="code" id="code">' + code + '</span><button class="nav-btn primary no-print" onclick="copyCode()">Copy code</button></div>' +
    '<ol class="steps" style="margin:16px 0 0 20px"><li>Copy your code.</li><li>' + (url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">Open the form</a>' : 'Open the Mentoring &amp; Coaching form') + ' and paste it into the "match code" question.</li><li>L&amp;D will review suggested matches and be in touch.</li></ol>' +
    '<div class="nav no-print"><button class="nav-btn" onclick="go(-1)">&larr; Change answers</button><button class="nav-btn" onclick="window.print()">Save as PDF</button>' +
    (url ? '<a class="nav-btn primary" href="' + esc(url) + '" target="_blank" rel="noopener" onclick="copyCode()">Copy &amp; open form &rarr;</a>' : '') + '</div></div>';
  return h;
}

function copyCode() {
  const code = document.getElementById('code').textContent;
  const done = () => toast('Code copied');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(code).then(done, fallback); else fallback();
  function fallback() {
    const ta = document.createElement('textarea'); ta.value = code; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('Select the code and copy it manually'); }
    ta.remove();
  }
}

let largeText = false;
try { largeText = localStorage.getItem('mc-text') === 'lg'; } catch (e) {}
function applyText() {
  document.body.classList.toggle('text-lg', largeText);
  const b = document.getElementById('text-btn'); b.setAttribute('aria-pressed', largeText); b.classList.toggle('active', largeText);
  b.textContent = largeText ? 'Reset text' : 'Larger text';
}
function toggleText() { largeText = !largeText; try { localStorage.setItem('mc-text', largeText ? 'lg' : 'normal'); } catch (e) {} applyText(); }

document.getElementById('logo').innerHTML = STORY_LOGO_SVG;
applyText();
render();
</script>
